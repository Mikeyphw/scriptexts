name: CB-NX01 Stardew Firefox Exact-File Handoff
on:
  pull_request:
    paths:
      - 'extensions/stardew-nexus-download-queue/src/**'
      - 'tools/tests/cbnx01-handoff.test.mjs'
      - 'tools/tests/cbnx03-pairing.test.mjs'
      - 'tools/tests/cbnx03b-security-gate.py'
      - '.github/workflows/cbnx01-nexus-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check extensions/stardew-nexus-download-queue/src/cbnx01-handoff.js
      - run: node --check extensions/stardew-nexus-download-queue/src/cbnx01-browser-bridge.js
      - run: node --check extensions/stardew-nexus-download-queue/src/content.js
      - run: node --check extensions/stardew-nexus-download-queue/src/background.js
      - run: node --test tools/tests/cbnx01-handoff.test.mjs
      - run: node --check extensions/stardew-nexus-download-queue/src/cbnx03-background.js
      - run: node --check extensions/stardew-nexus-download-queue/src/cbnx03-popup.js
      - run: node --test tools/tests/cbnx03-pairing.test.mjs
      - run: python3 tools/tests/cbnx03b-security-gate.py
      - run: python3 extensions/stardew-nexus-download-queue/build.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stardew-nexus-queue-unsigned-xpi
          path: extensions/stardew-nexus-download-queue/dist/*.xpi
          if-no-files-found: error
          retention-days: 14
