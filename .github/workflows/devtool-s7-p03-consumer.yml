name: Devtool S7 P03 scriptexts Consumer Adoption

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-adoption:
    name: Devtool consumer audit and exact-tree scaffold (non-release)
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout-minutes: 20
    steps:
      - name: Check out exact consumer source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Create disposable named branch for read-only Devtool identity
        run: git switch -c s7-p03-ci-inspection
      - name: Install pinned Devtool S7 P02 into isolated virtualenv
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/devtool-s7-p03-env"
          "$RUNNER_TEMP/devtool-s7-p03-env/bin/python" -m pip install --disable-pip-version-check \
            'git+https://github.com/Mikeyphw/devtool.git@416d24140c7f7a4b9833d7cb19df50ca7e7363b8'
          echo "$RUNNER_TEMP/devtool-s7-p03-env/bin" >> "$GITHUB_PATH"
      - name: Preserve consumer-specific static workflow contract
        run: python3 scripts/devtool_actions_contract.py
      - name: Canonical Devtool adoption pilot and source-drift negative test
        run: python3 -m unittest discover -s tests -p 'test_devtool_delivery_pilot.py' -v
