[project]
root = "."
runner = "node"
platform = "repository"

[workspace]
default_target = "workspace"

[workspace.groups]
builders = [
  "content-site-modernizer",
  "manga-reader-modernizer",
  "myreadingmanga-reimagined",
  "sims-cc-download-basket",
  "lpsg-media-gallery-unlocker",
  "poast-timeline-metadata-reset",
  "coomer-media-gallery",
]
standalone = ["search-engines-clean-dark-ui", "telegram-media-downloader-userscript"]
extensions = ["manga-site-media-downloader", "stardew-nexus-download-queue", "telegram-media-downloader-extension"]
userscripts = ["@builders", "@standalone"]
release = ["@userscripts", "@extensions"]
ci = ["root", "@release"]
smoke = ["smoke-python"]
all = ["@ci", "@smoke"]

[workspace.scheduler]
parallel = true
max_parallel_nodes = 3
max_gradle_nodes = 1
max_dotnet_nodes = 1

[node]
manager = "npm"
clean_install = false

[build]
max_workers = "auto"

# -----------------------------------------------------------------------------
# Workspace orchestrator
# -----------------------------------------------------------------------------
[targets.workspace]
root = "tools/devtool-workspace"
runner = "command"
platform = "workspace"
inputs = ["README.md"]
outputs = []

[targets.workspace.jobs.restore]
runner = "node"
root = "../.."
action = "restore"
inputs = ["package.json", "package-lock.json", "userscripts/builders/*/package.json"]
outputs = ["node_modules/**"]

[targets.workspace.workflows]
restore = ["job:restore"]
build = [
  { id = "content", ref = "target:content-site-modernizer#build", depends_on = [] },
  { id = "manga", ref = "target:manga-reader-modernizer#build", depends_on = [] },
  { id = "mrm", ref = "target:myreadingmanga-reimagined#build", depends_on = [] },
  { id = "sims", ref = "target:sims-cc-download-basket#build", depends_on = [] },
  { id = "lpsg", ref = "target:lpsg-media-gallery-unlocker#build", depends_on = [] },
  { id = "poast", ref = "target:poast-timeline-metadata-reset#build", depends_on = [] },
  { id = "coomer", ref = "target:coomer-media-gallery#build", depends_on = [] },
  { id = "ext_manga", ref = "target:manga-site-media-downloader#build", depends_on = [] },
  { id = "ext_stardew", ref = "target:stardew-nexus-download-queue#build", depends_on = [] },
  { id = "ext_telegram", ref = "target:telegram-media-downloader-extension#build", depends_on = [] },
  { id = "metadata", ref = "target:root#build", depends_on = ["content", "manga", "mrm", "sims", "lpsg", "poast", "coomer"] },
]
test = [
  { id = "content", ref = "target:content-site-modernizer#test", depends_on = [] },
  { id = "manga", ref = "target:manga-reader-modernizer#test", depends_on = [] },
  { id = "mrm", ref = "target:myreadingmanga-reimagined#test", depends_on = [] },
  { id = "sims", ref = "target:sims-cc-download-basket#test", depends_on = [] },
  { id = "lpsg", ref = "target:lpsg-media-gallery-unlocker#test", depends_on = [] },
  { id = "poast", ref = "target:poast-timeline-metadata-reset#test", depends_on = [] },
  { id = "coomer", ref = "target:coomer-media-gallery#test", depends_on = [] },
  { id = "telegram_user", ref = "target:telegram-media-downloader-userscript#test", depends_on = [] },
  { id = "ext_telegram", ref = "target:telegram-media-downloader-extension#test", depends_on = [] },
  { id = "root", ref = "target:root#test", depends_on = [] },
]
validate = [
  { id = "content", ref = "target:content-site-modernizer#validate", depends_on = [] },
  { id = "manga", ref = "target:manga-reader-modernizer#validate", depends_on = [] },
  { id = "mrm", ref = "target:myreadingmanga-reimagined#validate", depends_on = [] },
  { id = "sims", ref = "target:sims-cc-download-basket#validate", depends_on = [] },
  { id = "lpsg", ref = "target:lpsg-media-gallery-unlocker#validate", depends_on = [] },
  { id = "poast", ref = "target:poast-timeline-metadata-reset#validate", depends_on = [] },
  { id = "coomer", ref = "target:coomer-media-gallery#validate", depends_on = [] },
  { id = "search", ref = "target:search-engines-clean-dark-ui#validate", depends_on = [] },
  { id = "telegram_user", ref = "target:telegram-media-downloader-userscript#validate", depends_on = [] },
  { id = "ext_manga", ref = "target:manga-site-media-downloader#validate", depends_on = [] },
  { id = "ext_stardew", ref = "target:stardew-nexus-download-queue#validate", depends_on = [] },
  { id = "ext_telegram", ref = "target:telegram-media-downloader-extension#validate", depends_on = [] },
  { id = "metadata", ref = "target:root#build", depends_on = ["content", "manga", "mrm", "sims", "lpsg", "poast", "coomer", "search", "telegram_user"] },
  { id = "root_seal", ref = "target:root#seal", depends_on = ["metadata", "ext_manga", "ext_stardew", "ext_telegram"] },
]
seal = [
  { id = "content", ref = "target:content-site-modernizer#seal", depends_on = [] },
  { id = "manga", ref = "target:manga-reader-modernizer#seal", depends_on = [] },
  { id = "mrm", ref = "target:myreadingmanga-reimagined#seal", depends_on = [] },
  { id = "sims", ref = "target:sims-cc-download-basket#seal", depends_on = [] },
  { id = "lpsg", ref = "target:lpsg-media-gallery-unlocker#seal", depends_on = [] },
  { id = "poast", ref = "target:poast-timeline-metadata-reset#seal", depends_on = [] },
  { id = "coomer", ref = "target:coomer-media-gallery#seal", depends_on = [] },
  { id = "search", ref = "target:search-engines-clean-dark-ui#seal", depends_on = [] },
  { id = "telegram_user", ref = "target:telegram-media-downloader-userscript#seal", depends_on = [] },
  { id = "ext_manga", ref = "target:manga-site-media-downloader#seal", depends_on = [] },
  { id = "ext_stardew", ref = "target:stardew-nexus-download-queue#seal", depends_on = [] },
  { id = "ext_telegram", ref = "target:telegram-media-downloader-extension#seal", depends_on = [] },
  { id = "metadata", ref = "target:root#build", depends_on = ["content", "manga", "mrm", "sims", "lpsg", "poast", "coomer", "search", "telegram_user"] },
  { id = "root_seal", ref = "target:root#seal", depends_on = ["metadata", "ext_manga", "ext_stardew", "ext_telegram"] },
]
package = [
  { id = "content", ref = "target:content-site-modernizer#package", depends_on = [] },
  { id = "extensions", ref = "target:root#package", depends_on = [] },
]
smoke = [
  { id = "smoke", ref = "target:smoke-python#validate", depends_on = [] },
]

# -----------------------------------------------------------------------------
# Repository-level contracts and joins
# -----------------------------------------------------------------------------
ci-local = [
  { id = "source", ref = "target:root#ci-preflight", depends_on = [] },
  { id = "validate", ref = "target:workspace#validate", depends_on = ["source"] },
]

[targets.root]
root = "tools/devtool-root"
runner = "command"
platform = "repository"
inputs = [
  "README.md",
  "../../.devtool.toml",
  "../../package.json",
  "../../package-lock.json",
  "../../repo-manifest.json",
  "../../tools/check-repo.mjs",
  "../../tools/tests/**",
  "../../tools/generate-userscript-meta.mjs",
]
outputs = ["../../userscripts/**/*.meta.js", "../../release/**"]

[targets.root.jobs.metadata]
root = "../.."
runner = "command"
command = ["node", "tools/generate-userscript-meta.mjs"]
inputs = [
  "userscripts/standalone/**/*.user.js",
  "userscripts/builders/*/dist/**/*.user.js",
  "tools/generate-userscript-meta.mjs",
]
outputs = [
  "userscripts/standalone/**/*.user.js",
  "userscripts/standalone/**/*.meta.js",
  "userscripts/builders/*/dist/**/*.user.js",
  "userscripts/builders/*/dist/**/*.meta.js",
]

[targets.root.jobs.contract]
root = "../.."
runner = "command"
command = ["node", "--test", "tools/tests/devtool-target-coverage.test.mjs"]
inputs = [".devtool.toml", "tools/tests/devtool-target-coverage.test.mjs"]
outputs = []
[targets.root.jobs.contract.metadata]
read_only = true

[targets.root.jobs.tool-tests]
root = "../.."
runner = "command"
command = ["node", "--test", "tools/tests/*.test.mjs"]
inputs = ["tools/tests/**", "userscripts/**", "extensions/**", "repo-manifest.json"]
outputs = []
[targets.root.jobs.tool-tests.metadata]
read_only = true

[targets.root.jobs.repo-check]
root = "../.."
runner = "command"
command = ["node", "tools/check-repo.mjs"]
inputs = ["tools/check-repo.mjs", "repo-manifest.json", "userscripts/**", "extensions/**"]
outputs = []
[targets.root.jobs.repo-check.metadata]
read_only = true

[targets.root.jobs.inventory]
root = "../.."
runner = "command"
command = ["node", "tools/inventory.mjs"]
inputs = ["tools/inventory.mjs", "repo-manifest.json", "userscripts/**", "extensions/**"]
outputs = []
[targets.root.jobs.inventory.metadata]
read_only = true

[targets.root.jobs.chromium]
root = "../.."
runner = "command"
command = ["python3", "tools/build-chromium-extensions.py"]
inputs = ["tools/build-chromium-extensions.py", "extensions/**"]
outputs = ["extensions/*/dist/**"]

[targets.root.workflows]
build = ["job:metadata"]
test = ["job:contract"]
lint = ["job:contract"]
validate = ["job:contract"]
seal = [
  { id = "tests", ref = "job:tool-tests", depends_on = [] },
  { id = "repo", ref = "job:repo-check", depends_on = [] },
  { id = "inventory", ref = "job:inventory", depends_on = [] },
]
package = ["job:chromium"]

# -----------------------------------------------------------------------------
# Userscript builders
# -----------------------------------------------------------------------------
ci-preflight = [
  { id = "source", ref = "job:ci-source", depends_on = [] },
]

[targets.content-site-modernizer]
root = "userscripts/builders/content-site-modernizer"
runner = "node"
platform = "userscript-builder"
inputs = ["**", "../../../tools/content-sites/**", "../../../repo-manifest.json"]
outputs = ["dist/**", "../../../release/content-site-modernizer/**"]

[targets.content-site-modernizer.artifacts]
directories = ["dist"]
patterns = ["*.user.js", "*.meta.js"]
recursive = true
verify = true

[targets.content-site-modernizer.jobs.build]
runner = "command"
command = ["node", "build.mjs"]
inputs = ["build.mjs", "src/**", "package.json"]
outputs = ["dist/**"]

[targets.content-site-modernizer.jobs.reproducibility]
runner = "command"
command = ["node", "build.mjs", "--check"]
inputs = ["build.mjs", "src/**", "dist/**"]
outputs = []
[targets.content-site-modernizer.jobs.reproducibility.metadata]
read_only = true

[targets.content-site-modernizer.jobs.syntax]
runner = "command"
command = ["node", "--check", "src/core/runtime.template.js"]
inputs = ["src/core/runtime.template.js"]
outputs = []
[targets.content-site-modernizer.jobs.syntax.metadata]
read_only = true

[targets.content-site-modernizer.jobs.test]
runner = "command"
command = ["node", "--test", "test/*.test.mjs"]
inputs = ["src/**", "test/**"]
outputs = []
[targets.content-site-modernizer.jobs.test.metadata]
read_only = true

[targets.content-site-modernizer.jobs.profiles]
runner = "command"
command = ["node", "tools/check-profiles.mjs"]
inputs = ["src/profiles/**", "src/core/profile-schema.mjs", "tools/check-profiles.mjs"]
outputs = []
[targets.content-site-modernizer.jobs.profiles.metadata]
read_only = true

[targets.content-site-modernizer.jobs.seal]
runner = "command"
command = ["node", "../../../tools/content-sites/final-seal.mjs", "--builder", "content-site-modernizer", "--skip-build-check"]
inputs = ["src/**", "test/**", "dist/**", "smoke.config.json", "../../../tools/content-sites/**", "../../../repo-manifest.json"]
outputs = []
[targets.content-site-modernizer.jobs.seal.metadata]
read_only = true

[targets.content-site-modernizer.jobs.package]
runner = "command"
command = ["node", "../../../tools/content-sites/release-pack.mjs", "--builder", "content-site-modernizer"]
inputs = ["dist/**", "../../../tools/content-sites/release-pack.mjs"]
outputs = ["../../../release/content-site-modernizer/**"]

[targets.content-site-modernizer.workflows]
build = ["job:build"]
test = ["job:test"]
lint = [
  { id = "repro", ref = "job:reproducibility", depends_on = [] },
  { id = "syntax", ref = "job:syntax", depends_on = [] },
  { id = "profiles", ref = "job:profiles", depends_on = [] },
]
validate = [
  { id = "build", ref = "job:build", depends_on = [] },
  { id = "repro", ref = "job:reproducibility", depends_on = ["build"] },
  { id = "syntax", ref = "job:syntax", depends_on = ["build"] },
  { id = "test", ref = "job:test", depends_on = ["build"] },
  { id = "profiles", ref = "job:profiles", depends_on = ["build"] },
  { id = "seal", ref = "job:seal", depends_on = ["build"] },
]
seal = [
  { id = "build", ref = "job:build", depends_on = [] },
  { id = "seal", ref = "job:seal", depends_on = ["build"] },
]
package = [
  { id = "build", ref = "job:build", depends_on = [] },
  { id = "package", ref = "job:package", depends_on = ["build"] },
]

