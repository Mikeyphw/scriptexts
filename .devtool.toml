[project]
kind = "node"
root = "."

[workspace]
default_target = "root"

[workspace.groups]
builders = ["content-site-modernizer", "manga-reader-modernizer", "myreadingmanga-reimagined", "sims-cc-download-basket", "lpsg-media-gallery-unlocker", "poast-timeline-metadata-reset", "coomer-media-gallery"]
extensions = ["manga-site-media-downloader", "stardew-nexus-download-queue", "telegram-media-downloader-extension"]
userscripts = ["search-engines-clean-dark-ui", "telegram-media-downloader-userscript"]
smoke = ["smoke-python"]
all = ["root", "@builders", "@extensions", "@userscripts", "@smoke"]

[workspace.scheduler]
parallel = true
max_parallel_nodes = 3
max_gradle_nodes = 1
max_dotnet_nodes = 1
[node]
manager = "npm"
clean_install = false

[build]
max_workers = "auto"


# -----------------------------------------------------------------------------
# Devtool explicit smoke workflow convergence (OV03)
# -----------------------------------------------------------------------------
[jobs.scriptexts-smoke-build-content-sites]
runner = "command"
root = "."
command = ["npm", "run", "build:content-sites"]
inputs = [
  "package.json",
  "package-lock.json",
  "userscripts/builders/content-site-modernizer/**",
  "tools/smoke/**",
]
outputs = ["userscripts/builders/content-site-modernizer/dist/**"]

[jobs.scriptexts-smoke-content-sites-check]
runner = "python"
root = "."
command = ["python3", "tools/smoke/run-content-site-smoke.py", "--builder", "content-site-modernizer", "--check-config"]
inputs = [
  "tools/smoke/run-content-site-smoke.py",
  "userscripts/builders/content-site-modernizer/smoke.config.json",
  "userscripts/builders/content-site-modernizer/dist/**",
]
outputs = []

[jobs.scriptexts-smoke-content-sites-visual-check]
runner = "python"
root = "."
command = ["python3", "tools/smoke/run-content-site-visual.py", "--builder", "content-site-modernizer", "--check-config"]
inputs = [
  "tools/smoke/run-content-site-visual.py",
  "userscripts/builders/content-site-modernizer/smoke.config.json",
  "userscripts/builders/content-site-modernizer/dist/**",
]
outputs = []

[targets.root]
type = "node"
root = "."
inputs = [
    "package.json",
    "package-lock.json",
    "userscripts/**",
    "extensions/**",
    "tools/**",
    ".devtool.toml",
]
outputs = [
    "dist/**",
    "userscripts/**/dist/**",
    "extensions/**/dist/**",
]

[targets.content-site-modernizer]
type = "node"
root = "userscripts/builders/content-site-modernizer"
inputs = [
    "userscripts/builders/content-site-modernizer/**",
    "tools/**",
]
outputs = [
    "userscripts/builders/content-site-modernizer/dist/**",
]

[targets.manga-reader-modernizer]
type = "node"
root = "userscripts/builders/manga-reader-modernizer"
inputs = [
    "userscripts/builders/manga-reader-modernizer/**",
]
outputs = [
    "userscripts/builders/manga-reader-modernizer/dist/**",
]


[targets.myreadingmanga-reimagined]
type = "node"
root = "userscripts/builders/myreadingmanga-reimagined"
inputs = [
    "userscripts/builders/myreadingmanga-reimagined/**",
]
outputs = [
    "userscripts/builders/myreadingmanga-reimagined/dist/**",
]

[targets.sims-cc-download-basket]
type = "node"
root = "userscripts/builders/sims-cc-download-basket"
inputs = [
    "userscripts/builders/sims-cc-download-basket/**",
]
outputs = [
    "userscripts/builders/sims-cc-download-basket/dist/**",
]

[targets.manga-site-media-downloader]
type = "command"
root = "extensions/manga-site-media-downloader"
build_command = "python3 build.py"
inputs = [
    "extensions/manga-site-media-downloader/**",
]
outputs = [
    "extensions/manga-site-media-downloader/dist/**",
    "extensions/manga-site-media-downloader/build/**",
]

[targets.stardew-nexus-download-queue]
type = "command"
root = "extensions/stardew-nexus-download-queue"
build_command = "python3 build.py"
inputs = [
    "extensions/stardew-nexus-download-queue/**",
]
outputs = [
    "extensions/stardew-nexus-download-queue/dist/**",
    "extensions/stardew-nexus-download-queue/build/**",
]

[targets.telegram-media-downloader-extension]
type = "command"
root = "extensions/telegram-media-downloader"
build_command = "python3 build.py"
inputs = [
    "extensions/telegram-media-downloader/**",
]
outputs = [
    "extensions/telegram-media-downloader/dist/**",
    "extensions/telegram-media-downloader/build/**",
]

[targets.smoke-python]
type = "command"
root = "."
inputs = [
    "tools/smoke/**",
    "userscripts/builders/content-site-modernizer/**",
]
outputs = [
    "userscripts/builders/content-site-modernizer/dist/**",
]

[targets.smoke-python.workflows]
build = ["job:scriptexts-smoke-build-content-sites"]
test = [
    {id = "build_content_sites", ref = "job:scriptexts-smoke-build-content-sites", depends_on = []},
    {id = "smoke_config", ref = "job:scriptexts-smoke-content-sites-check", depends_on = ["build_content_sites"]},
    {id = "visual_config", ref = "job:scriptexts-smoke-content-sites-visual-check", depends_on = ["build_content_sites"]},
]
validate = [
    {id = "build_content_sites", ref = "job:scriptexts-smoke-build-content-sites", depends_on = []},
    {id = "smoke_config", ref = "job:scriptexts-smoke-content-sites-check", depends_on = ["build_content_sites"]},
    {id = "visual_config", ref = "job:scriptexts-smoke-content-sites-visual-check", depends_on = ["build_content_sites"]},
]
[targets.lpsg-media-gallery-unlocker]
type = "node"
root = "userscripts/builders/lpsg-media-gallery-unlocker"
inputs = [
    "userscripts/builders/lpsg-media-gallery-unlocker/**",
]
outputs = [
    "userscripts/builders/lpsg-media-gallery-unlocker/dist/**",
]

[targets.poast-timeline-metadata-reset]
type = "node"
root = "userscripts/builders/poast-timeline-metadata-reset"
inputs = [
    "userscripts/builders/poast-timeline-metadata-reset/**",
]
outputs = [
    "userscripts/builders/poast-timeline-metadata-reset/dist/**",
]

[targets.search-engines-clean-dark-ui]
type = "command"
root = "."
build_command = "node --check userscripts/standalone/search-engines-clean-dark-ui/search-engines-clean-dark-ui.user.js"
inputs = [
    "userscripts/standalone/search-engines-clean-dark-ui/**",
]

[targets.telegram-media-downloader-userscript]
type = "command"
root = "."
build_command = "node --check userscripts/standalone/telegram-media-downloader/telegram-media-downloader.user.js"
test_command = "node --test userscripts/standalone/telegram-media-downloader/test/*.test.mjs"
inputs = [
    "userscripts/standalone/telegram-media-downloader/**",
]


[targets.coomer-media-gallery]
type = "node"
root = "userscripts/builders/media-gallery"
build_command = "npm run check:coomer"
test_command = "npm test"
inputs = [
    "userscripts/builders/media-gallery/**",
]
outputs = [
    "userscripts/builders/media-gallery/dist/**",
]
