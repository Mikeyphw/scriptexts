# -----------------------------------------------------------------------------
# Repository wrapper: workspace first, component shortcuts second
# -----------------------------------------------------------------------------
[wrapper]
schema = 2
default_command = "validate"

[wrapper.commands.restore]
description = "Restore repository dependencies through the workspace TLJ"
workflow = "restore"
target = "workspace"
aliases = ["r"]

[wrapper.commands.build]
description = "Build every release component and refresh generated userscript metadata"
workflow = "build"
target = "workspace"
aliases = ["b"]

[wrapper.commands.test]
description = "Run the repository test graph through EXO/TLJ"
workflow = "test"
target = "workspace"
aliases = ["t"]

[wrapper.commands.check]
description = "Run lint/reproducibility checks for every CI target"
devtool = "lint"
group = "ci"
aliases = ["c"]

[wrapper.commands.validate]
description = "Run the complete repository validation DAG (default)"
workflow = "validate"
target = "workspace"
aliases = ["v"]

[wrapper.commands.seal]
description = "Run component release seals and repository final checks"
workflow = "seal"
target = "workspace"
aliases = ["s"]

[wrapper.commands.package]
description = "Create repository release packages through the workspace DAG"
workflow = "package"
target = "workspace"
aliases = ["pkg"]

[wrapper.commands.smoke]
description = "Run the managed content-site smoke configuration gates"
workflow = "smoke"
target = "workspace"

[wrapper.commands.userscripts]
description = "Validate every userscript target as one safe parallel workspace graph"
workflow = "validate"
group = "userscripts"
aliases = ["us"]

[wrapper.commands.extensions]
description = "Validate every browser extension target"
workflow = "validate"
group = "extensions"
aliases = ["ext"]

[wrapper.commands.lpsg]
description = "Validate only the LPSG media-gallery target"
workflow = "validate"
target = "lpsg-media-gallery-unlocker"

[wrapper.commands.content-sites]
description = "Validate only the content-site-modernizer target"
workflow = "validate"
target = "content-site-modernizer"
aliases = ["csm"]

[wrapper.commands.changed]
description = "Validate only Git-affected CI targets using dependency-aware ownership"
devtool = "validate"
group = "ci"
aliases = ["chg"]

[wrapper.commands.changed.options.affected]
type = "boolean"
default = true
global_argv = ["--affected"]

[wrapper.commands.changed.options.base]
type = "string"
description = "Git base revision for affected selection"
global_argv = ["--affected-base", "{value}"]

[wrapper.commands.changed.options.head]
type = "string"
description = "Git head revision for affected selection"
global_argv = ["--affected-head", "{value}"]

[wrapper.commands.changed.options.fail_fast]
type = "boolean"
description = "Stop independent branches after the first failure"
aliases = ["f"]
global_argv = ["--fail-fast"]

[targets.root.jobs.ci-source]
runner = "command"
root = "../.."
command = ["python3", "scripts/devtool_actions_contract.py"]
inputs = [".devtool.toml", "scripts/devtool_actions_contract.py", ".github/workflows/*.yml"]
outputs = []
[targets.root.jobs.ci-source.metadata]
read_only = true

[wrapper.commands.ci-preflight]
description = "Read-only CI source and workflow preflight"
workflow = "ci-preflight"
target = "root"

[wrapper.commands.ci-local]
description = "Run existing multi-target workspace validation DAG after source check"
workflow = "ci-local"
target = "workspace"
